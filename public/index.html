<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Omkar Kulkarni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Contact Omkar<br>Kulkarni</h1>
        <p class="intro">Fill out the form below to send a message.</p>

        <form action="/submit" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required minlength="2">

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message"
                      placeholder="Enter your message" required minlength="3"></textarea>

            <button type="submit">Submit Form</button>
        </form>
    </main>
</body>
</html>
